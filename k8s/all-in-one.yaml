apiVersion: v1
kind: Namespace
metadata:
  name: vnext-local-manager
  labels:
    app: vnext-local-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vnext-local-manager
  namespace: vnext-local-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vnext-local-manager-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vnext-local-manager-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vnext-local-manager-role
subjects:
  - kind: ServiceAccount
    name: vnext-local-manager
    namespace: vnext-local-manager
---
apiVersion: v1
kind: Service
metadata:
  name: vnext-local-manager
  namespace: vnext-local-manager
  labels:
    app: vnext-local-manager
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30800
      protocol: TCP
  selector:
    app: vnext-local-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vnext-local-manager
  namespace: vnext-local-manager
  labels:
    app: vnext-local-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vnext-local-manager
  template:
    metadata:
      labels:
        app: vnext-local-manager
    spec:
      securityContext:
        fsGroup: 1000
      serviceAccountName: vnext-local-manager
      automountServiceAccountToken: true
      containers:
        - name: app
          image: ghcr.io/burgan-tech/vnext-release-viewer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOME
              value: "/tmp"
            - name: HELM_CHART_REPO
              value: "oci://ghcr.io/burgan-tech/vnext"
            - name: ADMIN_PAGE_ENABLED
              value: "false"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
